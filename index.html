<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Periodic Table Quiz</title>
<style>
:root {
    /* --- COLOR PALETTE --- */
    --bg-dark: #0f172a;
    --text-primary: #ffffff;
    --text-secondary: rgba(255, 255, 255, 0.65);
    
    --accent-color: #38bdf8; 
    --accent-glow: rgba(56, 189, 248, 0.3);
    
    --success-color: #4ade80;
    --danger-color: #f87171;
    
    /* Apple System Font Stack */
    --font-main: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue", Helvetica, Arial, sans-serif;
    
    --mouse-x: 0.5;
    --mouse-y: 0.5;
}

body {
    font-family: var(--font-main);
    background-color: var(--bg-dark);
    color: var(--text-primary);
    margin: 0;
    min-height: 100vh;
    overflow: hidden;
    display: flex;
    justify-content: center;
    align-items: center;
    user-select: none;
    -webkit-font-smoothing: antialiased;
    
    /* Technical Grid Background */
    background-image: 
        linear-gradient(rgba(255, 255, 255, 0.03) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255, 255, 255, 0.03) 1px, transparent 1px),
        radial-gradient(circle at 0% 0%, var(--accent-glow), transparent 60%),
        radial-gradient(circle at 100% 100%, rgba(139, 92, 246, 0.2), transparent 60%);
    background-size: 40px 40px, 40px 40px, 100% 100%, 100% 100%;
    
    /* Parallax movement */
    background-position: 
        center, 
        center, 
        calc(var(--mouse-x) * -30px) calc(var(--mouse-y) * -30px), 
        calc(var(--mouse-x) * 30px) calc(var(--mouse-y) * 30px);
    transition: background-position 0.1s ease-out; 
}

/* --- ANIMATIONS & LAYOUT --- */
.screen {
    position: absolute; width: 100%; max-width: 1100px; height: 100vh;
    box-sizing: border-box; padding: 20px;
    opacity: 0; pointer-events: none;
    transform: scale(0.98) translateY(10px);
    transition: opacity 0.4s ease, transform 0.4s cubic-bezier(0.2, 0.8, 0.2, 1);
    display: flex; flex-direction: column; justify-content: center;
}
.screen.active { opacity: 1; pointer-events: all; transform: scale(1) translateY(0); z-index: 10; }
.screen.exiting { opacity: 0; transform: scale(1.02); filter: blur(5px); transition-duration: 0.2s; }

/* --- GLASS / PANEL STYLES --- */
.glass-panel {
    /* Clearer Glass: Lower opacity on the dark background */
    background: rgba(15, 23, 42, 0.3); 
    
    backdrop-filter: blur(25px) saturate(180%);
    -webkit-backdrop-filter: blur(25px) saturate(180%);
    
    border-radius: 20px;
    padding: 30px;
    box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
    
    /* Subtle borders */
    border: 1px solid rgba(255, 255, 255, 0.08);
    border-top: 1px solid rgba(255, 255, 255, 0.15);
    
    position: relative;
    overflow: hidden;
    transition: background 0.3s, border 0.3s, box-shadow 0.3s;
}

/* --- FLAT UI MODE OVERRIDES --- */
body.flat-ui .glass-panel {
    background: #1e293b; /* Solid Slate 800 */
    backdrop-filter: none;
    -webkit-backdrop-filter: none;
    border: 1px solid #334155;
    box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
}

body.flat-ui .element {
    backdrop-filter: none;
    background: #334155;
    border-color: #475569;
}
body.flat-ui .element:hover {
    background: #475569;
}
body.flat-ui .btn {
    backdrop-filter: none;
    background: #334155;
    border: 1px solid transparent;
}
body.flat-ui .btn:hover {
    background: var(--accent-color);
}
body.flat-ui .btn-secondary:hover {
    background: #475569;
}
body.flat-ui input[type="text"] {
    background: #0f172a;
    border-color: #334155;
}
body.flat-ui .score-circle {
    background: #1e293b;
    backdrop-filter: none;
    border-color: #334155;
}

h1.title {
    font-size: 4.5rem; font-weight: 700; margin: 0 0 40px 0; text-align: center; letter-spacing: -0.02em;
    color: white;
    text-shadow: 0 0 30px var(--accent-glow);
}

/* --- ATOM --- */
.atom-container {
    width: 140px; height: 140px; margin: 0 auto 30px auto; position: relative; transform-style: preserve-3d;
    transform: rotateY(calc(var(--mouse-x) * 25deg)) rotateX(calc(var(--mouse-y) * -25deg));
    transition: transform 0.1s ease-out;
}
.nucleus {
    width: 20px; height: 20px; background: white; border-radius: 50%;
    position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
    box-shadow: 0 0 40px white, 0 0 10px white;
}
.orbit {
    position: absolute; top: 50%; left: 50%; 
    border: 1.5px solid rgba(255,255,255,0.15); border-radius: 50%;
    box-shadow: 0 0 15px var(--accent-glow); 
    animation: spin 8s linear infinite;
}
.orbit:nth-child(2) { width: 50px; height: 130px; margin: -65px 0 0 -25px; animation-duration: 6s; border-color: var(--accent-color); }
.orbit:nth-child(3) { width: 130px; height: 50px; margin: -25px 0 0 -65px; animation-duration: 7s; }
.orbit:nth-child(4) { width: 90px; height: 90px; margin: -45px 0 0 -45px; animation-duration: 9s; border-color: rgba(255,255,255,0.3); }
@keyframes spin { 100% { transform: rotate(360deg); } }

/* --- BUTTONS --- */
.btn {
    background: rgba(255,255,255,0.08);
    backdrop-filter: blur(10px);
    color: white; 
    border: 1px solid rgba(255,255,255,0.08); 
    padding: 16px 32px;
    border-radius: 14px; /* Slightly squarer than pill */
    font-weight: 500; font-size: 1.05rem; cursor: pointer;
    transition: all 0.2s cubic-bezier(0.25, 0.8, 0.25, 1);
    
    /* Removed All Caps */
    text-transform: none; 
    letter-spacing: -0.01em;
}

.btn:hover { 
    transform: translateY(-2px); 
    background: var(--accent-color); 
    border-color: var(--accent-color);
    box-shadow: 0 8px 25px var(--accent-glow); 
    color: #0f172a;
    font-weight: 600;
}
.btn:active { transform: scale(0.96); }

.btn-secondary { background: transparent; color: var(--text-secondary); border-color: transparent; }
.btn-secondary:hover { background: rgba(255,255,255,0.1); color: white; border-color: rgba(255,255,255,0.15); box-shadow: none; }

/* --- TABLE --- */
.periodic-table { display: grid; grid-template-columns: repeat(18, 1fr); gap: 4px; width: 100%; overflow-x: auto; padding-bottom: 10px; }
.element {
    aspect-ratio: 1; 
    border: 1px solid rgba(255,255,255,0.1); 
    background: rgba(255,255,255,0.02); 
    border-radius: 8px;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    cursor: pointer; position: relative; 
    transition: all 0.15s ease-out;
    backdrop-filter: blur(4px);
}
.element strong { font-size: clamp(9px, 1.2vw, 15px); font-weight: 600; }
.element small { font-size: 8px; position: absolute; top: 3px; left: 3px; color: var(--text-secondary); }
.element:hover { 
    background: rgba(255,255,255,0.15); 
    border-color: rgba(255,255,255,0.5); 
    transform: scale(1.1); 
    z-index: 50; 
}
.element.selected { 
    background: var(--accent-color) !important; 
    color: #0f172a !important; 
    border-color: var(--accent-color) !important; 
    box-shadow: 0 0 20px var(--accent-glow); 
}
.element.selected small { color: rgba(0,0,0,0.5); }

/* --- QUIZ UI --- */
.quiz-wrapper { display: grid; grid-template-columns: 2fr 1fr; gap: 20px; height: 100%; max-height: 75vh; }
.table-container { 
    background: rgba(0,0,0,0.2); 
    border-radius: 20px; padding: 15px; 
    border: 1px solid rgba(255,255,255,0.05); 
    overflow-y: auto; 
}
.quiz-panel h3 { color: white; margin-top: 0; font-size: 1.4rem; font-weight: 600; }
.input-group { margin-bottom: 20px; }
.input-group label { 
    display: block; color: var(--text-secondary); 
    margin-bottom: 8px; font-size: 0.9rem; font-weight: 500;
    text-transform: none; /* No Caps */
}
input[type="text"] {
    width: 100%; padding: 14px; 
    background: rgba(0, 0, 0, 0.2); 
    border: 1px solid rgba(255, 255, 255, 0.1);
    border-radius: 12px; color: white; 
    box-sizing: border-box; font-family: var(--font-main); font-size: 1.05rem;
    transition: all 0.2s;
}
input[type="text"]:focus { 
    outline: none; 
    border-color: var(--accent-color); 
    background: rgba(0,0,0,0.4); 
}

/* --- REPORT UI --- */
.report-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; height: 60vh; }
.score-card { display: flex; flex-direction: column; justify-content: center; align-items: center; text-align: center; }
.score-circle {
    width: 180px; height: 180px; border-radius: 50%;
    /* Glass Circle */
    background: rgba(255,255,255,0.03);
    border: 1px solid rgba(255,255,255,0.1);
    backdrop-filter: blur(10px);
    
    display: flex; justify-content: center; align-items: center;
    font-size: 3.5rem; font-weight: 700; color: white;
    box-shadow: 0 0 40px var(--accent-glow); margin-bottom: 25px;
}
.mistakes-list { overflow-y: auto; padding-right: 10px; }
.mistake-item {
    background: rgba(255,255,255,0.03); border: 1px solid rgba(255,255,255,0.08);
    border-radius: 12px; padding: 16px; margin-bottom: 10px;
}
.mistake-header { display: flex; justify-content: space-between; margin-bottom: 8px; font-weight: 600; color: var(--text-primary); }
.mistake-detail { font-size: 0.9rem; color: var(--text-secondary); display: flex; justify-content: space-between; border-top: 1px solid rgba(255,255,255,0.05); padding-top: 8px; margin-top: 8px; }
.val-correct { color: var(--success-color); }
.val-wrong { color: var(--danger-color); text-decoration: line-through; margin-right: 8px; opacity: 0.8; }

/* --- SETTINGS --- */
.modal-overlay {
    position: fixed; inset: 0; background: rgba(0,0,0,0.6); backdrop-filter: blur(8px); z-index: 100;
    display: flex; justify-content: center; align-items: center; opacity: 0; pointer-events: none; transition: opacity 0.2s;
}
.modal-overlay.open { opacity: 1; pointer-events: all; }
.swatch { width: 35px; height: 35px; border-radius: 50%; cursor: pointer; border: 2px solid rgba(255,255,255,0.1); transition: transform 0.2s; }
.swatch:hover { transform: scale(1.1); border-color: white; }
.swatch.active { border-color: white; transform: scale(1.1); box-shadow: 0 0 15px var(--accent-glow); }

/* Switch Toggle for Flat Mode */
.switch { position: relative; display: inline-block; width: 50px; height: 26px; }
.switch input { opacity: 0; width: 0; height: 0; }
.slider { position: absolute; cursor: pointer; top: 0; left: 0; right: 0; bottom: 0; background-color: #334155; transition: .4s; border-radius: 34px; }
.slider:before { position: absolute; content: ""; height: 18px; width: 18px; left: 4px; bottom: 4px; background-color: white; transition: .4s; border-radius: 50%; }
input:checked + .slider { background-color: var(--accent-color); }
input:checked + .slider:before { transform: translateX(24px); }

/* Custom Scrollbar */
::-webkit-scrollbar { width: 6px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.15); border-radius: 10px; }
::-webkit-scrollbar-thumb:hover { background: rgba(255,255,255,0.3); }

@media (max-width: 900px) { .quiz-wrapper, .report-grid { grid-template-columns: 1fr; } h1.title { font-size: 3rem; } }
</style>
</head>
<body>

<script>
    const AudioFx = {
        ctx: null, enabled: true,
        init() { if(!this.ctx) this.ctx = new (window.AudioContext || window.webkitAudioContext)(); },
        playTone(freq, type, duration, vol, delay=0) {
            if(!this.enabled || !this.ctx) return;
            const t = this.ctx.currentTime + delay;
            const osc = this.ctx.createOscillator();
            const gain = this.ctx.createGain();
            const filter = this.ctx.createBiquadFilter();
            osc.type = type; osc.frequency.setValueAtTime(freq, t);
            filter.type = 'lowpass'; filter.frequency.setValueAtTime(1000, t); 
            gain.gain.setValueAtTime(0, t);
            gain.gain.linearRampToValueAtTime(vol, t + 0.02);
            gain.gain.exponentialRampToValueAtTime(0.001, t + duration);
            osc.connect(filter); filter.connect(gain); gain.connect(this.ctx.destination);
            osc.start(t); osc.stop(t + duration);
        },
        hover() { this.playTone(400, 'sine', 0.1, 0.03); },
        click() { this.playTone(800, 'sine', 0.1, 0.05); },
        tick() { this.playTone(800, 'sine', 0.03, 0.03); }, 
        success() { 
            this.playTone(523.25, 'sine', 0.4, 0.05, 0); 
            this.playTone(659.25, 'sine', 0.4, 0.05, 0.05); 
            this.playTone(783.99, 'sine', 0.6, 0.05, 0.10); 
        },
    };

    document.addEventListener('mousemove', (e) => {
        const x = (e.clientX / window.innerWidth) * 2 - 1;
        const y = (e.clientY / window.innerHeight) * 2 - 1;
        document.body.style.setProperty('--mouse-x', x);
        document.body.style.setProperty('--mouse-y', y);
    });
</script>

<div id="menuScreen" class="screen active">
    <div style="display: flex; flex-direction: column; align-items: center;">
        <div class="atom-container">
            <div class="nucleus"></div>
            <div class="orbit"></div>
            <div class="orbit"></div>
            <div class="orbit"></div>
        </div>
        <h1 class="title">Periodic<br>Table Quiz</h1>
        <div class="glass-panel" style="display:flex; flex-direction:column; gap:12px; width: 260px; padding: 25px;">
            <button class="btn" onmouseenter="AudioFx.hover()" onclick="nav('setup')">Begin Study</button>
            <button class="btn btn-secondary" onmouseenter="AudioFx.hover()" onclick="toggleSettings()">Settings</button>
        </div>
    </div>
</div>

<div id="settingsModal" class="modal-overlay">
    <div class="glass-panel" style="width: 320px; text-align: center;">
        <h3 style="margin: 0 0 25px 0; font-weight: 600;">Settings</h3>
        
        <div style="text-align:left; margin-bottom:20px;">
            <div style="display:flex; justify-content: space-between; align-items: center; margin-bottom: 15px;">
                <span style="font-weight: 500;">Sound Effects</span>

                    <input type="checkbox" checked onchange="AudioFx.enabled = this.checked; if(this.checked) AudioFx.click();">

                </label>
            </div>
            <div style="display:flex; justify-content: space-between; align-items: center;">
                <span style="font-weight: 500;">Glass Effects</span>
                <label class="switch">
                    <input type="checkbox" checked onchange="toggleDesign(this.checked)">
                    <span class="slider"></span>
                </label>
            </div>
        </div>

        <div>
            <small style="color:var(--text-secondary); display:block; margin-bottom:15px; font-weight: 600;">Interface Color</small>

                <div class="swatch active" style="background:#38bdf8" onclick="setTheme('#38bdf8', this)"></div>

            </div>
        </div>
        <button class="btn btn-secondary" style="margin-top: 30px; width: 100%;" onclick="toggleSettings()">Done</button>
    </div>
</div>

<div id="setupScreen" class="screen">

        <div style="display:flex; gap:15px; align-items: center;">
            <button class="btn btn-secondary" style="padding: 10px 18px; border-radius: 12px;" onclick="nav('menu')">←</button>
            <h2 style="margin:0; font-size: 1.5rem; font-weight:600;">Setup</h2>
        </div>
        <div style="display:flex; gap:25px;">
            <label style="cursor:pointer; display:flex; gap:8px; align-items: center; font-weight: 500;"><input type="checkbox" value="name" checked style="accent-color:var(--accent-color); transform: scale(1.1);"> Name</label>
            <label style="cursor:pointer; display:flex; gap:8px; align-items: center; font-weight: 500;"><input type="checkbox" value="symbol" checked style="accent-color:var(--accent-color); transform: scale(1.1);"> Symbol</label>

        </div>

    <div class="glass-panel" style="flex:1; display:flex; flex-direction: column;">
        <div class="periodic-table" id="setupTable"></div>
        <div style="margin-top: 25px; text-align: center; display: flex; gap: 15px; justify-content: center;">
            <button class="btn btn-secondary" onclick="selectAll()">Select All</button>
            <button class="btn btn-secondary" onclick="clearSel()">Clear</button>
            <button class="btn" style="width: 180px; margin-left:10px;" onclick="startQuiz()">Start Quiz</button>
        </div>
        <div style="text-align: center; margin-top: 15px; font-size: 0.9rem; color: var(--text-secondary);">

        </div>
    </div>
</div>

<div id="testScreen" class="screen">
    <div style="display:flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
        <button class="btn btn-secondary" style="padding: 10px 20px; font-size: 0.9rem;" onclick="generateReport()">Quit</button>
        <div id="progressDisplay" style="font-weight: 600; color: white; background: rgba(255,255,255,0.1); padding: 8px 20px; border-radius: 20px;">1 / 10</div>
    </div>
    
    <div class="quiz-wrapper">

        </div>
        <div class="glass-panel quiz-panel" style="display:flex; flex-direction: column;">
            <h3 id="qHeader">Question</h3>
            <div id="inputs"></div>
            <button id="nextBtn" class="btn" style="width:100%; margin-top: auto;" onclick="nextQ()">Next</button>
        </div>
    </div>
</div>

<div id="reportScreen" class="screen">
    <div class="glass-panel" style="height: 100%; display: flex; flex-direction: column;">
        <div style="display:flex; justify-content: space-between; align-items: center; margin-bottom: 30px;">
            <h2 style="margin:0; font-size: 1.8rem;">Results</h2>
            <button class="btn btn-secondary" onclick="nav('setup')">Start Over</button>
        </div>
        
        <div class="report-grid">
            <div class="score-card">

                </p>
            </div>
            <div style="display:flex; flex-direction: column; height: 100%;">
                <h4 style="margin: 0 0 15px 0; color: var(--accent-color); font-size: 0.9rem; font-weight: 600;">Areas for Improvement</h4>
                <div class="mistakes-list" id="mistakesLog">
                    </div>
            </div>
        </div>
    </div>
</div>

let sel = new Set();
let curTest = [];
let curIdx = 0;
let curFields = [];
let curScreen = 'menu';
let isDragging = false;
let dragAdd = true;

function nav(id) {
    AudioFx.init(); AudioFx.click();
    const oldS = document.getElementById(curScreen + 'Screen');
    const newS = document.getElementById(id + 'Screen');
    oldS.classList.add('exiting');
    oldS.classList.remove('active');
    setTimeout(() => {
        oldS.classList.remove('exiting');
        newS.classList.add('active');
    }, 250);
    curScreen = id;
}

function toggleSettings() {
    AudioFx.init(); AudioFx.click();
    document.getElementById('settingsModal').classList.toggle('open');
}

function toggleDesign(isGlass) {
    AudioFx.click();
    if(isGlass) document.body.classList.remove('flat-ui');
    else document.body.classList.add('flat-ui');
}

function setTheme(c, el) {
    AudioFx.click();
    document.documentElement.style.setProperty('--accent-color', c);
    document.documentElement.style.setProperty('--accent-glow', c + '66'); 
    document.querySelectorAll('.swatch').forEach(s => s.classList.remove('active'));
    el.classList.add('active');
}

// --- SETUP & DRAG SELECT ---
function renderSetup() {
    const setupT = document.getElementById('setupTable');
    setupT.innerHTML = '';
    
    document.addEventListener('mouseup', () => isDragging = false);

    for(let i=1; i<=126; i++) {
        const e = elements.find(x => x.p === i);
        const div = document.createElement('div');
        if(e) {
            div.className = sel.has(e) ? 'element selected' : 'element';
            div.innerHTML = `<strong>${e.s}</strong><small>${e.num}</small>`;
            
            div.onmousedown = (evt) => {
                evt.preventDefault();
                isDragging = true;
                dragAdd = !sel.has(e);
                toggleSelection(e, div);
            };
            div.onmouseenter = () => {
                if(isDragging) toggleSelection(e, div);
                else AudioFx.hover();
            };
        } else {
            div.style.visibility='hidden'; div.style.pointerEvents='none';
        }
        setupT.appendChild(div);
    }
}

function toggleSelection(e, div) {
    const has = sel.has(e);
    if((dragAdd && !has) || (!dragAdd && has)) {
        AudioFx.tick();
        if(dragAdd) { sel.add(e); div.classList.add('selected'); }
        else { sel.delete(e); div.classList.remove('selected'); }
    }
}

function selectAll() { AudioFx.click(); elements.forEach(e => sel.add(e)); renderSetup(); }
function clearSel() { AudioFx.click(); sel.clear(); renderSetup(); }

// --- QUIZ LOGIC ---
function startQuiz() {
    curFields = [...document.querySelectorAll('#setupScreen input:checked')].map(c => c.value);
    if(!sel.size || !curFields.length) return alert('Select elements and fields');
    
    curTest = Array.from(sel).sort((a,b) => a.p - b.p);
    curTest.forEach(t => curFields.forEach(f => t[`_a_${f}`] = '')); 
    
    const tt = document.getElementById('testTable');
    tt.innerHTML = '';
    for(let i=1; i<=126; i++) {
        const div = document.createElement('div');
        const idx = curTest.findIndex(x => x.p === i);
        if(idx !== -1) {
            div.className = 'element';
            div.id = `tc-${idx}`;
            div.innerHTML = `<strong>${idx+1}</strong>`;
            div.onclick = () => loadQ(idx);
        } else {
            const exists = elements.find(x => x.p === i);
            div.className = 'element'; div.style.opacity = '0.05'; div.style.pointerEvents='none';
            if(!exists) div.style.visibility='hidden';
        }
        tt.appendChild(div);
    }
    
    loadQ(0);
    nav('test');
}

function loadQ(idx) {
    if(idx !== curIdx) AudioFx.click();
    curIdx = idx;
    const el = curTest[idx];
    
    document.getElementById('progressDisplay').innerText = `${curIdx + 1} / ${curTest.length}`;
    
    document.querySelectorAll('#testTable .element').forEach(e => {
        e.classList.remove('selected');
    });
    const cell = document.getElementById(`tc-${idx}`);
    if(cell) {
        cell.classList.add('selected');
        cell.scrollIntoView({behavior:'smooth', block:'center'});
    }

    document.getElementById('qHeader').innerText = `Element ${idx+1} (Atomic #${el.num})`;
    const ct = document.getElementById('inputs');
    ct.innerHTML = '';
    
    curFields.forEach(f => {
        const lbl = f.charAt(0).toUpperCase() + f.slice(1);
        const val = el[`_a_${f}`] || '';
        ct.innerHTML += `
        <div class="input-group">
            <label>${lbl}</label>
            <input type="text" value="${val}" autocomplete="off"
             oninput="curTest[${idx}]['_a_${f}']=this.value"
             onkeydown="if(event.key==='Enter') nextQ()">
        </div>`;
    });

    const btn = document.getElementById('nextBtn');
    btn.innerText = (curIdx === curTest.length - 1) ? "Finish" : "Next";
    btn.onclick = (curIdx === curTest.length - 1) ? generateReport : nextQ;

    setTimeout(() => {
        const first = ct.querySelector('input');
        if(first) first.focus();
    }, 50);
}

function nextQ() {
    if(curIdx < curTest.length - 1) loadQ(curIdx+1);
}

// --- REPORTING LOGIC ---
function generateReport() {
    AudioFx.success();
    nav('report');
    
    let correctCount = 0;
    let totalCount = 0;
    const log = document.getElementById('mistakesLog');
    log.innerHTML = '';
    
    let hasMistakes = false;

    curTest.forEach(t => {
        let elementMistakes = [];
        
        curFields.forEach(f => {
            totalCount++;
            let key = '';
            if(f==='name') key='n'; if(f==='symbol') key='s'; 
            if(f==='number') key='num'; if(f==='mass') key='m';
            
            const expected = String(t[key]);
            const given = String(t[`_a_${f}`] || '').trim();
            
            if(expected.toLowerCase() === given.toLowerCase()) {
                correctCount++;
            } else {
                elementMistakes.push({ field: f, expected: expected, given: given || '(empty)' });
            }
        });

        if(elementMistakes.length > 0) {
            hasMistakes = true;
            let html = `<div class="mistake-item">
                <div class="mistake-header">${t.n} (${t.s})</div>`;
            
            elementMistakes.forEach(m => {
                const label = m.field.charAt(0).toUpperCase() + m.field.slice(1);
                html += `<div class="mistake-detail">
                    <span>${label}</span>
                    <span><span class="val-wrong">${m.given}</span> <span class="val-correct">${m.expected}</span></span>
                </div>`;
            });
            html += `</div>`;
            log.innerHTML += html;
        }
    });

    if(!hasMistakes) {
        log.innerHTML = `<div style="text-align:center; padding:20px; color:var(--success-color); font-weight:600;">Perfect Score! No mistakes found.</div>`;
    }

    const percentage = Math.round((correctCount / totalCount) * 100);
    const scoreEl = document.getElementById('finalScore');
    scoreEl.innerText = percentage + '%';
    
    if(percentage >= 90) { scoreEl.style.color = 'var(--success-color)'; scoreEl.style.boxShadow = '0 0 50px var(--success-color)'; }
    else if(percentage < 70) { scoreEl.style.color = 'var(--danger-color)'; scoreEl.style.boxShadow = '0 0 50px var(--danger-color)'; }
    else { scoreEl.style.color = 'var(--accent-color)'; scoreEl.style.boxShadow = '0 0 50px var(--accent-glow)'; }
}

renderSetup();
